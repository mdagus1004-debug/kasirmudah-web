<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KasirMudah App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9;padding:10px;max-width:520px;margin:auto}
.top{background:#111827;color:#fff;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:18px}.top b span{color:#ff6b00}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.prod{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;text-align:left}
.prod b{display:block}.prod small{color:#64748b}
.prod:disabled{opacity:.5;cursor:not-allowed}
.cart,.panel{background:#fff;border-radius:12px;padding:12px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #e2e8f0;gap:8px}
.total{font-size:20px;font-weight:bold;display:flex;justify-content:space-between;margin:10px 0}
input,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0;font-size:16px}
.login{max-width:400px;margin:40px auto;background:#fff;padding:20px;border-radius:16px;text-align:center}
.hidden{display:none}
.muted{color:#64748b}
#struk{display:none}
@media print{
 @page{size:58mm auto;margin:2mm}
 body{background:#fff;padding:0;max-width:none}
 body>*:not(#struk){display:none!important}
 #struk{display:block;width:54mm;font-family:"Courier New",monospace;font-size:11px;color:#000}
 #struk .c{text-align:center}
 #struk .r{display:flex;justify-content:space-between}
 #struk hr{border:0;border-top:1px dashed #000;margin:4px 0}
}
</style></head>
<body>

<div id="login" class="login">
<h2>Kasir<span style="color:#ff6b00">Mudah</span></h2>
<p class="muted" style="margin:8px 0">Masukkan PIN</p>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')masuk()">
<button style="background:#ff6b00;color:#fff;width:100%" onclick="masuk()">MASUK</button>
<p class="muted" style="margin-top:10px;font-size:12px">Mode demo: coba PIN Bos 1234</p>
</div>

<div id="app" class="hidden">
<div class="top"><b>Kasir<span>Mudah</span></b><span id="roleTxt">BOS</span></div>

<label style="font-size:12px">Toko</label>
<select id="toko" onchange="gantiToko()"></select>

<div class="grid" id="produk"></div>

<div class="cart">
<b>Keranjang</b>
<div id="keranjang"></div>
<div class="total"><span>Total</span><span id="totalTxt">0</span></div>
<label id="bayarLbl">Bayar</label>
<input id="bayar" type="number" inputmode="decimal" min="0" step="any" placeholder="0" oninput="hitungKembali()">
<div style="display:flex;justify-content:space-between"><span>Kembali</span><b id="kembaliTxt">0</b></div>
<button style="background:#111827;color:#fff;width:100%;margin-top:10px" onclick="bayar()">BAYAR &amp; PRINT</button>
<label style="font-size:12px;display:block;margin-top:10px">No. WhatsApp pelanggan (opsional)</label>
<input id="hp" type="tel" inputmode="tel" placeholder="mis. 0812xxxx / 012xxxx">
<button style="background:#25D366;color:#fff;width:100%" onclick="kirimWA()">KIRIM STRUK KE WA</button>
<button style="background:#e2e8f0;width:100%;margin-top:8px" onclick="resetKeranjang()">Reset Keranjang</button>
</div>

<div id="laporanBox" class="panel hidden">
<b>Laporan</b>
<div id="laporan"></div>
</div>

<button style="background:#fff;border:1px solid #e2e8f0;width:100%;margin-top:10px" onclick="logout()">Keluar</button>
</div>

<div id="struk"></div>

<script>
const KEY='kasirmudah_v1';
const DEFAULT=[
{id:'my1',name:'Kedai Makcik - Johor (RM)',cur:'RM',items:[{n:'Nasi Lemak',p:850,s:20},{n:'Kopi O',p:450,s:30},{n:'Teh Tarik',p:500,s:30},{n:'Roti Canai',p:650,s:15}]},
{id:'id1',name:'Warung Budi - Jakarta (Rp)',cur:'Rp',items:[{n:'Nasi Goreng',p:18000,s:20},{n:'Es Teh',p:5000,s:30},{n:'Kopi Hitam',p:8000,s:25}]}
];
let stores,sales,curStore,cart={},role='BOS',lastSale=null;

function load(){
 try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.stores)){stores=d.stores;sales=d.sales||[];return;}}catch(e){}
 stores=JSON.parse(JSON.stringify(DEFAULT));sales=[];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({stores:stores,sales:sales}));}catch(e){}}
load();
curStore=stores[0];

const tokoEl=document.getElementById('toko');
stores.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name;tokoEl.appendChild(o);});

// RM disimpan dalam sen; Rp dalam rupiah penuh
function mul(s){return (s||curStore).cur==='RM'?100:1;}
function fmtS(s,v){return s.cur==='RM'?'RM '+(v/100).toFixed(2):'Rp '+Math.round(v).toLocaleString('id-ID');}
function fmt(v){return fmtS(curStore,v);}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function masuk(){
 const pin=document.getElementById('pin').value;
 if(pin==='9999')role='OWNER';
 else if(pin==='1234')role='BOS';
 else if(pin==='1111')role='KARYAWAN';
 else{alert('PIN salah!');return;}
 document.getElementById('login').classList.add('hidden');
 document.getElementById('app').classList.remove('hidden');
 document.getElementById('roleTxt').textContent=role;
 document.getElementById('laporanBox').classList.toggle('hidden',role==='KARYAWAN');
 render();
}
function gantiToko(){
 curStore=stores.find(s=>s.id===tokoEl.value);
 cart={};document.getElementById('bayar').value='';render();
}
function render(){
 let h='';
 curStore.items.forEach((it,i)=>{
  const habis=it.s<=0;
  h+=`<button class="prod" ${habis?'disabled':''} onclick="tambah(${i})"><b>${esc(it.n)}</b><small>Stok: ${it.s}</small><br><b style="color:#ff6b00">${fmt(it.p)}</b><br><small>${habis?'Habis':'+ Tambah'}</small></button>`;
 });
 document.getElementById('produk').innerHTML=h;
 document.getElementById('bayarLbl').textContent='Bayar ('+(curStore.cur==='RM'?'RM, mis. 10 atau 10.50':'Rp, mis. 20000')+')';
 renderCart();renderLaporan();
}
function tambah(i){
 const it=curStore.items[i];
 if((cart[i]||0)>=it.s){alert('Stok '+it.n+' tidak cukup');return;}
 cart[i]=(cart[i]||0)+1;renderCart();
}
function kurang(i){cart[i]--;if(cart[i]<=0)delete cart[i];renderCart();}
function totalVal(){let t=0;for(const i in cart)t+=curStore.items[i].p*cart[i];return t;}
function renderCart(){
 let h='';
 for(const i in cart){
  const it=curStore.items[i],q=cart[i];
  h+=`<div class="row"><span>${esc(it.n)} x ${q} <button onclick="kurang(${i})" style="padding:2px 8px;background:#fee2e2">-</button></span><b>${fmt(it.p*q)}</b></div>`;
 }
 if(!h)h='<p class="muted" style="padding:8px 0">Belum ada barang. Pencet produk di atas.</p>';
 document.getElementById('keranjang').innerHTML=h;
 document.getElementById('totalTxt').textContent=fmt(totalVal());
 hitungKembali();
}
function bayarUnits(){return Math.round(Number(document.getElementById('bayar').value||0)*mul());}
function hitungKembali(){
 document.getElementById('kembaliTxt').textContent=fmt(Math.max(0,bayarUnits()-totalVal()));
}
function cartItems(){return Object.keys(cart).map(i=>({n:curStore.items[i].n,q:cart[i],p:curStore.items[i].p}));}

function bayar(){
 const tot=totalVal();
 if(tot===0){alert('Keranjang kosong');return;}
 const b=bayarUnits();
 if(b<tot){alert('Uang bayar kurang! Total '+fmt(tot));return;}
 for(const i in cart)curStore.items[i].s-=cart[i];
 const sale={t:Date.now(),store:curStore.id,items:cartItems(),total:tot,bayar:b};
 sales.push(sale);lastSale=sale;save();
 cetak(sale);
 resetKeranjang();render();
}
function cetak(sale){
 const s=stores.find(x=>x.id===sale.store);
 const d=new Date(sale.t);
 let h=`<div class="c"><b>${esc(s.name)}</b><br>${d.toLocaleString('id-ID')}</div><hr>`;
 sale.items.forEach(it=>{
  h+=`<div>${esc(it.n)}</div><div class="r"><span>${it.q} x ${fmtS(s,it.p)}</span><span>${fmtS(s,it.p*it.q)}</span></div>`;
 });
 h+=`<hr><div class="r"><b>TOTAL</b><b>${fmtS(s,sale.total)}</b></div>`;
 h+=`<div class="r"><span>Bayar</span><span>${fmtS(s,sale.bayar)}</span></div>`;
 h+=`<div class="r"><span>Kembali</span><span>${fmtS(s,sale.bayar-sale.total)}</span></div><hr><div class="c">Terima kasih<br>KasirMudah.app</div>`;
 document.getElementById('struk').innerHTML=h;
 window.print();
}
function resetKeranjang(){cart={};document.getElementById('bayar').value='';renderCart();}

function normHP(raw,cur){
 let n=String(raw||'').replace(/\D/g,'');
 if(!n)return '';
 const cc=cur==='RM'?'60':'62';
 if(n.startsWith('00'))n=n.slice(2);
 else if(n.startsWith('0'))n=cc+n.slice(1);
 return n;
}
function kirimWA(){
 let items,store,tot;
 if(Object.keys(cart).length){items=cartItems();store=curStore;tot=totalVal();}
 else if(lastSale&&lastSale.store===curStore.id){items=lastSale.items;store=curStore;tot=lastSale.total;}
 else{alert('Belum ada transaksi. Isi keranjang atau selesaikan pembayaran dulu.');return;}
 let msg='Struk '+store.name+'\n';
 items.forEach(it=>{msg+=it.n+' x '+it.q+' = '+fmtS(store,it.p*it.q)+'\n';});
 msg+='Total: '+fmtS(store,tot)+'\nTerima kasih - KasirMudah';
 const hp=normHP(document.getElementById('hp').value,store.cur);
 window.open('https://wa.me/'+hp+'?text='+encodeURIComponent(msg),'_blank');
}

function renderLaporan(){
 if(role==='KARYAWAN')return;
 const today=new Date().toDateString();
 const list=role==='OWNER'?stores:[curStore];
 let h='';
 list.forEach(s=>{
  const ss=sales.filter(x=>x.store===s.id&&new Date(x.t).toDateString()===today);
  const sum=ss.reduce((a,x)=>a+x.total,0);
  h+=`<div class="row"><span>${esc(s.name)}<br><small class="muted">${ss.length} transaksi hari ini</small></span><b>${fmtS(s,sum)}</b></div>`;
 });
 h+='<p style="margin-top:10px"><b>Transaksi terakhir</b></p>';
 const recent=sales.filter(x=>list.some(s=>s.id===x.store)).slice(-8).reverse();
 if(!recent.length)h+='<p class="muted" style="padding:6px 0">Belum ada transaksi.</p>';
 recent.forEach(x=>{
  const s=stores.find(y=>y.id===x.store);
  h+=`<div class="row"><span><small class="muted">${new Date(x.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</small> ${x.items.map(i=>esc(i.n)+' x'+i.q).join(', ')}</span><b>${fmtS(s,x.total)}</b></div>`;
 });
 h+='<p style="margin-top:10px"><b>Tambah stok (+10)</b></p>';
 curStore.items.forEach((it,i)=>{
  h+=`<div class="row"><span>${esc(it.n)} <small class="muted">(stok ${it.s})</small></span><button style="background:#dcfce7" onclick="restok(${i})">+10</button></div>`;
 });
 if(role==='OWNER')h+='<button style="background:#fee2e2;width:100%;margin-top:10px" onclick="resetData()">Reset semua data demo</button>';
 h+='<p class="muted" style="font-size:11px;margin-top:8px">Mode demo: data tersimpan di browser perangkat ini saja.</p>';
 document.getElementById('laporan').innerHTML=h;
}
function restok(i){curStore.items[i].s+=10;save();render();}
function resetData(){
 if(!confirm('Hapus semua penjualan dan kembalikan stok awal?'))return;
 try{localStorage.removeItem(KEY);}catch(e){}
 location.reload();
}
function logout(){location.reload();}
</script>
</body></html>
