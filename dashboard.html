<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KasirMudah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <span>⚡</span> KasirMudah
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active">📊 Dashboard</a>
                <a href="#" class="nav-item">🛒 Kasir (POS)</a>
                <a href="#" class="nav-item">📦 Produk & Stok</a>
                <a href="#" class="nav-item">🧾 Riwayat Transaksi</a>
                <a href="#" class="nav-item">⚙️ Pengaturan</a>
                <a href="index.html" class="nav-item" style="margin-top: auto; color: #EF4444;">⬅️ Kembali ke Beranda</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header-area">
                <h1>Ringkasan Hari Ini</h1>
                <button class="btn btn-primary">+ Transaksi Baru</button>
            </header>

            <div class="dashboard-grid">
                <div class="card">
                    <div class="card-title">Total Omzet</div>
                    <div class="card-value">Rp 2.450.000</div>
                </div>
                <div class="card">
                    <div class="card-title">Transaksi Selesai</div>
                    <div class="card-value">48</div>
                </div>
                <div class="card">
                    <div class="card-title">Produk Terjual</div>
                    <div class="card-value">124</div>
                </div>
                <div class="card">
                    <div class="card-title">Peringatan Stok</div>
                    <div class="card-value" style="color: #EF4444;">3 Produk</div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
